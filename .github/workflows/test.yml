name: Create Azure Resource Group

on:
  push:
    branches:
      - main
      - 'features/**'

  workflow_dispatch:
    inputs:
      action:
        description: 'Select Terraform Action'
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply

permissions:
  contents: read

env:
  ARM_CLIENT_ID: ${{ fromJSON(secrets.my_secret).clientId }}
  ARM_CLIENT_SECRET: ${{ fromJSON(secrets.my_secret).clientSecret }}
  ARM_SUBSCRIPTION_ID: ${{ fromJSON(secrets.my_secret).subscriptionId }}
  ARM_TENANT_ID: ${{ fromJSON(secrets.my_secret).tenantId }}

jobs:
  terraform:
    name: Terraform Plan and Manual Apply
    runs-on: windows-latest

    steps:
      # STEP 1 - CHECKOUT
      - name: Checkout Code
        uses: actions/checkout@v4

      # STEP 2 - TERRAFORM INSTALL
      - name: Terraform Installer
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      # STEP 3 - AZURE LOGIN
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.my_secret }}

      # STEP 4 - TERRAFORM INIT
      - name: Terraform Init
        working-directory: ./dev
        run: terraform init

      # STEP 5 - TERRAFORM VALIDATE
      - name: Terraform Validate
        working-directory: ./dev
        run: terraform validate

      # STEP 6 - TERRAFORM PLAN
      - name: Terraform Plan
        working-directory: ./dev
        run: terraform plan -out=tfplan

      # STEP 7 - MANUAL APPLY
      - name: Terraform Apply
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'apply' }}
        working-directory: ./dev
        run: terraform apply -auto-approve tfplan

        working-directory: ./dev
        run: terraform apply -auto-approve tfplan
